spring:
  datasource:
    url: jdbc:postgresql://localhost:5436/enroll_db
    username: enroll_user
    password: enroll_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
