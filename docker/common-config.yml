services:
  network-deploy-service:
    networks:
      - uniflow

  microservice-base-config:
    extends:
      service: network-deploy-service
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    deploy:
      resources:
        limits:
          memory: 700m

  microservice-configserver-config:
    extends:
      service: microservice-base-config
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_CLOUD_CONFIG_URI: "http://configserver-ms:8071"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://configserver-ms:8071/"
      SPRING_CLOUD_CONFIG_ALLOW_OVERRIDE: "true"
      SPRING_CLOUD_CONFIG_OVERRIDE_SYSTEM_PROPERTIES: "false"
  microservice-eureka-config:
    extends:
      service: microservice-configserver-config
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver-ms:8761/eureka/
  microservice-kafka-config:
      extends:
        service: microservice-eureka-config
      environment:
        SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"