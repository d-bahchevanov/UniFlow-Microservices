services:
  configserver:
    image: "uniflow/configserver:cs"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    container_name: configserver-ms
    ports:
      - "8071:8071"
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL: main
      SPRING_CLOUD_CONFIG_SERVER_OVERRIDES_ALLOW_OVERRIDE: "true"
    healthcheck:
      test: "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-base-config
    networks:
      - uniflow

  eurekaserver:
    image: "uniflow/eurekaserver:es"
    container_name: eurekaserver-ms
    ports:
      - "8761:8761"
    depends_on:
      configserver:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8761/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-configserver-config
    environment:
      SPRING_APPLICATION_NAME: "eurekaserver"
    networks:
      - uniflow

  identity-service:
    image: "uniflow/identity-service:ic"
    container_name: identity-ms
    ports:
      - "8080:8080"
    depends_on:
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8080/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "identity"
      DB_HOST: "identity_postgres"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://identity_postgres:5432/identity_db"
    extends:
      file: common-config.yml
      service: microservice-kafka-config
    networks:
      - uniflow

  profile-service:
    image: "uniflow/profile-service:pc"
    container_name: profile-ms
    ports:
      - "8081:8081"
    depends_on:
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8081/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "profile"
      DB_HOST: "profile-db"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://profile-db:5432/profile_db"
    extends:
      file: common-config.yml
      service: microservice-kafka-config
    networks:
      - uniflow

  academic-service:
    image: "uniflow/academic-service:ac"
    container_name: academy-ms
    ports:
      - "8090:8090"
    depends_on:
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8090/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "academic"
      DB_HOST: "academy_postgres"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://academy_postgres:5432/academy_db"
    extends:
      file: common-config.yml
      service: microservice-kafka-config
    networks:
      - uniflow

  enroll-service:
    image: "uniflow/enroll-service:ec"
    container_name: enrollment-ms
    ports:
      - "9000:9000"
    depends_on:
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:9000/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "enrollment"
      DB_HOST: "enroll_postgres"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://enroll_postgres:5432/enroll_db"
    extends:
      file: common-config.yml
      service: microservice-kafka-config
    networks:
      - uniflow

  gatewayserver:
    image: "uniflow/gatewayserver:gs"
    container_name: gatewayserver-ms
    ports:
      - "8072:8072"
    depends_on:
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      profile-service:
        condition: service_healthy
      academic-service:
        condition: service_healthy
      enroll-service:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "gateway-server"
    extends:
      file: common-config.yml
      service: microservice-eureka-config
    networks:
      - uniflow

networks:
  uniflow:
    driver: "bridge"